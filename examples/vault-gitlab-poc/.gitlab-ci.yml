# Proof that a GitLab job can read its own project's Vault secret with nothing
# but its ID token. VAULT_ADDR and VAULT_CACERT are instance-level CI variables
# (gitlab_instance_variable in terraform/gitlab-vault/runner.tf); every project
# logs in with the one role "ci" (vault_jwt_auth_backend_role.ci in
# terraform/gitlab-vault/projects.tf), which reads only the logging-in project's
# kv/ci/production/project-<id>/*. The aud below must equal
# var.vault_incluster_url in terraform/gitlab-vault/variables.tf. Nothing secret is printed: only the byte count. The
# Kubernetes executor ignores the image entrypoint by default
# (FF_KUBERNETES_HONOR_ENTRYPOINT=false), so the vault image needs no override.
stages: [verify]

read-vault-secret:
  stage: verify
  image: docker.io/hashicorp/vault:2.2.0@sha256:e0acd3c681bdf57f002d7214e5d050b876e1704678005c6b0406dd96a65be919
  id_tokens:
    VAULT_ID_TOKEN:
      aud: https://vault.vault.svc.cluster.local:8200
  script:
    - VAULT_TOKEN="$(printf '%s' "${VAULT_ID_TOKEN}" | vault write -field=token auth/gitlab/login role=ci jwt=-)"
    - export VAULT_TOKEN
    - vault kv get -mount=kv -field=AWS_ACCESS_KEY_ID "ci/production/project-${CI_PROJECT_ID}/aws" | wc -c
    # Isolation: another project's path must be refused by policy (any other outcome fails the job).
    - |
      out="$(vault kv get -mount=kv "ci/production/project-0/isolation-probe" 2>&1 || true)"
      case "${out}" in
        *"permission denied"*) echo "another project's path: permission denied" ;;
        *) echo "isolation check failed: ${out}"; exit 1 ;;
      esac
    - vault token revoke -self
