# Proof that a GitLab job can read its own project's Vault secret with nothing
# but its ID token. VAULT_ADDR and VAULT_CACERT are instance-level CI variables
# (gitlab_instance_variable in terraform/gitlab-vault/runner.tf); the Vault
# role is created per project by vault_jwt_auth_backend_role.project in
# terraform/gitlab-vault/projects.tf and is named ci-<group>-<project>, which
# the job derives from CI_PROJECT_PATH. The aud below must equal
# var.vault_incluster_url in terraform/gitlab-vault/variables.tf. Nothing secret is printed: only the byte count. The
# Kubernetes executor ignores the image entrypoint by default
# (FF_KUBERNETES_HONOR_ENTRYPOINT=false), so the vault image needs no override.
stages: [verify]

read-vault-secret:
  stage: verify
  image: docker.io/hashicorp/vault:2.0.4@sha256:5be49781ecf78bfe775c5309c6a4d9f4e9e040b6c885c99eb2b12fb69855e1a2
  id_tokens:
    VAULT_ID_TOKEN:
      aud: https://vault.vault.svc.cluster.local:8200
  script:
    - VAULT_TOKEN="$(printf '%s' "${VAULT_ID_TOKEN}" | vault write -field=token auth/gitlab/login role="ci-$(printf '%s' "${CI_PROJECT_PATH}" | tr '/' '-')" jwt=-)"
    - export VAULT_TOKEN
    - vault kv get -mount=kv -field=AWS_ACCESS_KEY_ID "ci/production/project-${CI_PROJECT_ID}/aws" | wc -c
    - vault token revoke -self
