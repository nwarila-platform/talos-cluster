# The Internet entry point: two replicas of Cloudflare's connector (replicas are for availability
# only; there is no load balancing) run the remotely managed keycloak tunnel from the token in the
# cloudflared-keycloak Secret, which terraform/cloudflare writes. The tunnel's ingress rule (also
# in Terraform) sends the public name to https://keycloak-service.keycloak.svc.cluster.local:8443
# and verifies Keycloak's certificate against the Vault CA mounted here from the vault-ca ConfigMap
# (scripts/install-platform.sh). Until the Secret exists the pods wait in ContainerCreating.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: keycloak
  labels:
    app.kubernetes.io/name: cloudflared
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.10.1@sha256:a15a3b50b8dabd57ac2090e9484c0247dba9dfa1f0df4d298d4317f9d69eb2d5
          args:
            - tunnel
            - --no-autoupdate
            - --loglevel
            - info
            - --output
            - json
            - --metrics
            - 0.0.0.0:2000
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-keycloak
                  key: token
          ports:
            - name: metrics
              containerPort: 2000
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: vault-ca
              mountPath: /etc/cloudflared/vault-ca.crt
              subPath: vault-ca.crt
              readOnly: true
      volumes:
        - name: vault-ca
          configMap:
            name: vault-ca
            items:
              - key: vault-ca.crt
                path: vault-ca.crt
