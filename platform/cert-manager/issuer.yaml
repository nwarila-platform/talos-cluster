# The cluster-wide issuer for names under trinitytechnicalservices.com. cert-manager logs in to
# Vault with a ten-minute token it mints for the vault-issuer service account (Kubernetes auth;
# the Vault role vault-issuer and its sign-only policy live in
# terraform/gitlab-vault/vault-k8s-auth.tf) and asks pki-int-linux to sign the CSR under the
# tcn-server role. No credential is stored: Vault verifies each token through the TokenReview API
# with its own service account. The trust anchor for Vault's serving certificate is the vault-ca
# Secret, written by scripts/install-platform.sh from .state/vault/tls/ca.crt. A ClusterIssuer's
# service account is looked up in cert-manager's cluster-resource namespace, which is this one.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-issuer
  namespace: cert-manager
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vault-issuer-token
  namespace: cert-manager
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["vault-issuer"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vault-issuer-token
  namespace: cert-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vault-issuer-token
subjects:
  - kind: ServiceAccount
    name: cert-manager
    namespace: cert-manager
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: vault-tcn-server
spec:
  vault:
    server: https://vault.vault.svc.cluster.local:8200
    path: pki-int-linux/sign/tcn-server
    caBundleSecretRef:
      name: vault-ca
      key: ca.crt
    auth:
      kubernetes:
        mountPath: /v1/auth/kubernetes
        role: vault-issuer
        serviceAccountRef:
          name: vault-issuer
