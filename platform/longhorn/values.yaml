# =============================================================================
# Longhorn Helm values
#
# Chart: longhorn/longhorn pinned by LONGHORN_VERSION in cluster/config.env.
#
# Talos-side coupling: the data path below (/var/mnt/longhorn) is the
# Talos auto-mount of the `longhorn` UserVolumeConfig declared in
# cluster/patches/volumes-{controlplane,worker}.yaml and exposed to kubelet by
# the writable bind mount in cluster/patches/common.yaml.
# =============================================================================

defaultSettings:
  # Mount path of the Talos UserVolumeConfig `longhorn` (auto-mounted by
  # Talos at /var/mnt/<volume-name>). This is the one setting that hard-
  # couples Helm-side Longhorn to Talos-side storage; changing it without
  # also changing the UserVolumeConfig name in
  # cluster/patches/volumes-{controlplane,worker}.yaml and the kubelet bind
  # mount in cluster/patches/common.yaml leaves Longhorn writing to EPHEMERAL
  # instead of the dedicated encrypted volume (50-140 GiB on control planes,
  # 50-240 GiB on workers).
  defaultDataPath: /var/mnt/longhorn

  # Tolerate the management taint on Longhorn system-managed components:
  # instance-manager, engine-image, CSI plugin and CSI controller sidecars,
  # share-manager, backing-image-manager/data-source and recurring-job pods.
  taintToleration: "nwarila.io/management:NoSchedule"

  # 2-way replication remains the small-cluster default for ordinary PVCs:
  # it tolerates one node loss without applying 3x storage cost to every
  # workload. Chart default is 3. The defaultClassReplicaCount below pins the
  # same number for the default StorageClass. Vault does not use Longhorn; it
  # uses the vault-local StorageClass on the u-vault volume
  # (platform/vault/storage.yaml).
  defaultReplicaCount: 2

  # Force-delete pods stranded on a downed node so the StatefulSet/
  # Deployment can recreate them elsewhere. Without this, a node failure
  # leaves PVC-bound pods Pending indefinitely behind a Terminating
  # placeholder, blocking failover.
  nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod

  # Permit replica placement when a node has ≥10% free space (chart
  # default 25%). The Talos UserVolumeConfig caps the longhorn volume at
  # 140 GiB on control planes and 240 GiB on workers; 25% of those caps is
  # 35 GiB and 60 GiB held in reserve, which is more conservative than this
  # cluster's workloads warrant.
  storageMinimalAvailablePercentage: 10

  # At most one automatic engine upgrade in flight per node (engines on
  # different nodes may upgrade concurrently) after a Longhorn `helm upgrade`.
  # Chart default is 0 (automatic engine upgrade disabled).
  concurrentAutomaticEngineUpgradePerNodeLimit: 1

  # Auto-attach detached volumes to make them eligible for RecurringJob runs
  # (chart default false).
  allowRecurringJobWhileVolumeDetached: true

defaultBackupStore:
  # DR Stage 1 backup target: a dedicated Btrfs NFS share on the Synology
  # RS3621rpxs (TCNHQ-BKUP01, 10.69.128.115) on its own storage VLAN. NFS is
  # credential-free (AUTH_SYS); access is controlled by a per-node-IP export on
  # the NAS. No in-cluster egress policy restricts this traffic on this branch.
  # nfsvers is pinned to 4.1 (DSM's max; Longhorn treats 4.1 as first-class) for
  # a deterministic mount instead of a 4.2->4.1 probe; actimeo=1 is Longhorn's
  # default and avoids v4.1 backup-list cache staleness. NAS-side daily
  # immutable snapshots (retain 30) add tamper/ransomware protection the NFS
  # client cannot reach.
  backupTarget: "nfs://10.69.128.115:/volume1/longhorn-backup?nfsOptions=nfsvers=4.1,actimeo=1"
  backupTargetCredentialSecret: ""

# Tolerate the management NoSchedule taint on the user-deployed Longhorn
# components: longhornManager covers the longhorn-manager DaemonSet (which must
# run on all six nodes) and the chart's upgrade/uninstall hook Jobs;
# longhornDriver covers the single longhorn-driver-deployer pod, which may
# therefore land on a control plane. longhorn-ui has no toleration and stays
# on workers.
longhornManager:
  tolerations:
    - key: nwarila.io/management
      operator: Exists
      effect: NoSchedule
longhornDriver:
  tolerations:
    - key: nwarila.io/management
      operator: Exists
      effect: NoSchedule

persistence:
  # `longhorn` becomes the cluster's default StorageClass. PVCs without
  # an explicit storageClassName get a Longhorn-backed volume.
  defaultClass: true
  # Matches defaultReplicaCount above so the default SC and the global
  # default don't disagree.
  defaultClassReplicaCount: 2
