global:
  tlsDisable: false

injector:
  enabled: false

server:
  # Pinned here rather than left to the chart default, so a bump is one visible line. The StatefulSet
  # updates OnDelete: after helm upgrade, delete the standbys one at a time, then the active pod; the
  # unsealer reopens each. Take a raft snapshot first: once a new version is active, going back means
  # restoring it.
  image:
    repository: hashicorp/vault
    tag: "2.2.0@sha256:e0acd3c681bdf57f002d7214e5d050b876e1704678005c6b0406dd96a65be919"
  nodeSelector:
    nwarila.io/pool: management
  tolerations:
    - effect: NoSchedule
      key: nwarila.io/management
      operator: Exists
  volumes:
    - name: vault-server-tls
      secret:
        secretName: vault-server-tls
  volumeMounts:
    - name: vault-server-tls
      mountPath: /vault/userconfig/tls
      readOnly: true
  service:
    type: ClusterIP
    active:
      enabled: false
    standby:
      enabled: false
  dataStorage:
    enabled: true
    size: 32Gi
    storageClass: vault-local
    accessMode: ReadWriteOnce
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  standalone:
    enabled: false
  ha:
    enabled: true
    replicas: 3
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = false

        listener "tcp" {
          address         = "[::]:8200"
          cluster_address = "[::]:8201"
          tls_disable     = 0
          tls_cert_file   = "/vault/userconfig/tls/tls.crt"
          tls_key_file    = "/vault/userconfig/tls/tls.key"
          tls_client_ca_file = "/vault/userconfig/tls/ca.crt"
        }

        storage "raft" {
          path = "/vault/data"
          retry_join {
            leader_api_addr         = "https://vault-0.vault-internal.vault.svc.cluster.local:8200"
            leader_tls_servername   = "vault-0.vault-internal.vault.svc.cluster.local"
            leader_ca_cert_file     = "/vault/userconfig/tls/ca.crt"
            leader_client_cert_file = "/vault/userconfig/tls/tls.crt"
            leader_client_key_file  = "/vault/userconfig/tls/tls.key"
          }
          retry_join {
            leader_api_addr         = "https://vault-1.vault-internal.vault.svc.cluster.local:8200"
            leader_tls_servername   = "vault-1.vault-internal.vault.svc.cluster.local"
            leader_ca_cert_file     = "/vault/userconfig/tls/ca.crt"
            leader_client_cert_file = "/vault/userconfig/tls/tls.crt"
            leader_client_key_file  = "/vault/userconfig/tls/tls.key"
          }
          retry_join {
            leader_api_addr         = "https://vault-2.vault-internal.vault.svc.cluster.local:8200"
            leader_tls_servername   = "vault-2.vault-internal.vault.svc.cluster.local"
            leader_ca_cert_file     = "/vault/userconfig/tls/ca.crt"
            leader_client_cert_file = "/vault/userconfig/tls/tls.crt"
            leader_client_key_file  = "/vault/userconfig/tls/tls.key"
          }
        }

        service_registration "kubernetes" {}

ui:
  enabled: false
