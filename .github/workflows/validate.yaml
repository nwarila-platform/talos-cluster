name: Validate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned talosctl
        run: |
          set -euo pipefail
          source cluster/config.env
          curl --proto '=https' --tlsv1.2 -fsSLo talosctl \
            "https://github.com/siderolabs/talos/releases/download/${TALOS_VERSION}/talosctl-linux-amd64"
          curl --proto '=https' --tlsv1.2 -fsSLo sha256sum.txt \
            "https://github.com/siderolabs/talos/releases/download/${TALOS_VERSION}/sha256sum.txt"
          expected="$(awk '$2=="talosctl-linux-amd64" {print $1}' sha256sum.txt)"
          printf '%s  talosctl\n' "${expected}" | sha256sum -c -
          chmod 0755 talosctl
          sudo mv talosctl /usr/local/bin/talosctl

      - name: Install lint tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck yamllint
          source cluster/config.env
          version="${ACTIONLINT_VERSION#v}"
          archive="actionlint_${version}_linux_amd64.tar.gz"
          base="https://github.com/rhysd/actionlint/releases/download/${ACTIONLINT_VERSION}"
          curl --proto '=https' --tlsv1.2 -fsSLo "${archive}" "${base}/${archive}"
          curl --proto '=https' --tlsv1.2 -fsSLo actionlint-checksums.txt "${base}/actionlint_${version}_checksums.txt"
          grep "  ${archive}$" actionlint-checksums.txt | sha256sum -c -
          tar -xzf "${archive}" actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint

      - name: Generate and validate Talos configs
        run: |
          set -euo pipefail
          export STATE_DIR_OVERRIDE="${RUNNER_TEMP}/talos-state"
          bash scripts/generate.sh
          bash scripts/validate.sh

      - name: Render pinned Helm charts
        run: |
          set -euo pipefail
          source cluster/config.env
          helm repo add projectcalico https://docs.tigera.io/calico/charts
          helm repo add longhorn https://charts.longhorn.io
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo add hashicorp https://helm.releases.hashicorp.com
          helm repo update
          charts="${RUNNER_TEMP}/charts"
          mkdir -p "${charts}"
          helm template calico-crds projectcalico/crd.projectcalico.org.v1 \
            --version "${CALICO_VERSION}" >"${charts}/calico-crds.yaml"
          crd_count="$(grep -c '^kind: CustomResourceDefinition$' "${charts}/calico-crds.yaml" || true)"
          [[ "${crd_count}" == "32" ]] || {
            echo "expected 32 Calico CRDs, rendered ${crd_count}" >&2
            exit 1
          }
          crd_name_count="$(grep -c '^  name: installations.operator.tigera.io$' "${charts}/calico-crds.yaml" || true)"
          [[ "${crd_name_count}" == "1" ]] || {
            echo "expected one installations.operator.tigera.io CRD, rendered ${crd_name_count}" >&2
            exit 1
          }
          helm pull projectcalico/tigera-operator --version "${CALICO_VERSION}" \
            --untar --untardir "${charts}"
          helm pull longhorn/longhorn --version "${LONGHORN_VERSION}" \
            --untar --untardir "${charts}"
          helm pull argo/argo-cd --version "${ARGO_CD_VERSION}" \
            --untar --untardir "${charts}"
          helm pull hashicorp/vault --version "${VAULT_CHART_VERSION}" \
            --untar --untardir "${charts}"
          helm lint "${charts}/tigera-operator" \
            --values platform/calico/values.yaml --strict
          helm template calico "${charts}/tigera-operator" \
            --namespace tigera-operator \
            --api-versions admissionregistration.k8s.io/v1/MutatingAdmissionPolicy \
            --values platform/calico/values.yaml >/dev/null
          helm lint "${charts}/longhorn" \
            --values platform/longhorn/values.yaml --strict
          helm template longhorn "${charts}/longhorn" \
            --namespace longhorn-system \
            --values platform/longhorn/values.yaml >/dev/null
          helm lint "${charts}/argo-cd" \
            --values platform/argocd/values.yaml --strict
          helm template argocd "${charts}/argo-cd" \
            --namespace argocd \
            --values platform/argocd/values.yaml >/dev/null
          helm lint "${charts}/vault" \
            --values platform/vault/values.yaml --strict
          helm template vault "${charts}/vault" \
            --namespace vault \
            --values platform/vault/values.yaml >/dev/null

      - name: Reject tracked runtime secrets
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.state|\.s3)/|kubeconfig$|talosconfig$|init\.json$|\.(key|pem)$'; then
            echo "runtime secret material is tracked" >&2
            exit 1
          fi
