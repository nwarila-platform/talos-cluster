name: Secret Scan

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSLo gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  gitleaks.tar.gz\n' "${GITLEAKS_SHA256}" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan git history
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            [[ -n "${BASE_SHA}" ]] || {
              echo "ERROR: BASE_SHA is required for pull_request scans" >&2
              exit 1
            }
            ./gitleaks git . --redact --exit-code 1 --log-opts="${BASE_SHA}..HEAD"
          else
            ./gitleaks git . --redact --exit-code 1 --log-opts="--all"
          fi
      - name: Scan working tree
        run: ./gitleaks dir . --redact --exit-code 1
