# Child reconciliation for the nwp-public Traefik ingress proxy. Keeping this
# inventory under one prune boundary makes rollback remove the proxy, its class,
# its scoped RBAC, and both sides of its network-policy contract together.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: traefik-nwp-public
  namespace: flux-system
spec:
  interval: 10m
  path: ./clusters/talos-cluster/apps/traefik-nwp-public
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: traefik-nwp-public
      namespace: traefik-nwp-public
