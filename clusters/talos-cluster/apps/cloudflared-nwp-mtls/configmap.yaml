apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: cloudflared-nwp-mtls
data:
  config.yaml: |
    tunnel: fb6932d9-c6e4-4ccb-8e4c-dee47aa05313
    credentials-file: /etc/cloudflared/creds/credentials.json
    metrics: 0.0.0.0:2000
    no-autoupdate: true
    # Connector-side defence in depth, applied to EVERY rule below: cloudflared
    # is configured to reject a request that lacks a Cloudflare Access JWT
    # matching the pinned audience, so a hostname that reaches this tunnel
    # before its edge registration is complete cannot reach an origin through
    # the configured connector. The live audience-to-application binding is
    # verified separately.
    # The intended edge posture supplies the primary controls (client
    # certificate and Access OTP); live enforcement is verified separately.
    originRequest:
      access:
        required: true
        teamName: kra1432
        audTag:
          - 107bea2d67b644c4de37c267bbe5994a7e26c4781861b467c1981a3f30c71f35
    # Managed hostnames are intended to reach this connector only by explicit
    # per-FQDN DNS records, written LAST by the registration step after the
    # mTLS association, Access application domain, and WAF entry exist.
    ingress:
      - hostname: canary-nwp-mtls.nickwarila.com
        service: http_status:418
      - hostname: '*.nickwarila.com'
        service: http://traefik-nwp-mtls.traefik-nwp-mtls.svc:80
      - service: http_status:404
