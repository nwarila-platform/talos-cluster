apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cloudflared-nwp-mtls-egress
  namespace: cloudflared-nwp-mtls
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
      app.kubernetes.io/instance: nwp-mtls
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    # Source: https://developers.cloudflare.com/cloudflare-one/networks/connectors/cloudflare-tunnel/configure-tunnels/tunnel-with-firewall/
    # Retrieved 2026-08-29. Re-verify the regional endpoint set whenever the
    # pinned cloudflared minor version changes or a connectivity precheck fails.
    - toFQDNs:
        - matchName: region1.v2.argotunnel.com
        - matchName: region2.v2.argotunnel.com
      toPorts:
        - ports:
            - port: "7844"
              protocol: TCP
            - port: "7844"
              protocol: UDP
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": traefik-nwp-mtls
            "k8s:nwarila.io/tunnel-proxy": "nwp-mtls"
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
