apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-nwp-public
  namespace: traefik-nwp-public
spec:
  interval: 10m
  releaseName: traefik-nwp-public
  chart:
    spec:
      chart: traefik
      version: "41.2.0"
      sourceRef:
        kind: HelmRepository
        name: traefik
      interval: 1h
  upgrade:
    remediation:
      remediateLastFailure: false
    cleanupOnFail: true
  test:
    enable: false
  values:
    fullnameOverride: traefik-nwp-public
    versionOverride: v3.7.10
    image:
      registry: docker.io
      repository: library/traefik
      tag: v3.7.12@sha256:9c2a54d87f76f5c2f5f2682c68394af92fb12c0a2686798d6462a3f84bd78eaf

    deployment:
      replicas: 2
      podLabels:
        nwarila.io/tunnel-proxy: nwp-public

    # The chart defaults create a default class and broad RBAC. Both are
    # replaced by the explicit, nwp-public-scoped resources in this directory.
    ingressClass:
      enabled: false
    rbac:
      enabled: false

    # Kubernetes Ingress is the only enabled dynamic configuration provider.
    # The explicit namespace list bounds informer-driven Secret exposure to the
    # single registered nwarila-platform tenant.
    providers:
      kubernetesCRD:
        enabled: false
      kubernetesIngress:
        enabled: true
        ingressClass: cf-tunnel-nwp-public
        namespaces:
          - nwp-1306985678
        allowExternalNameServices: false
        crossProviderNamespaces: []
        publishedService:
          enabled: false
        strictPrefixMatching: true
      kubernetesGateway:
        enabled: false
      file:
        enabled: false
      kubernetesIngressNGINX:
        enabled: false
      knative:
        enabled: false

    gateway:
      enabled: false
    gatewayClass:
      enabled: false
    hub:
      enabled: false
    api:
      dashboard: false
    global:
      checkNewVersion: false
      sendAnonymousUsage: false

    # cloudflared uses Service port 80. Cilium evaluates the translated pod
    # destination, so both sides of that policy pair intentionally use 8000.
    ports:
      web:
        port: 8000
        exposedPort: 80
        expose:
          default: true
      websecure:
        expose:
          default: false
    service:
      spec:
        type: ClusterIP

    serviceAccount:
      name: traefik-nwp-public
    persistence:
      enabled: false
    hostNetwork: false
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            nwarila.io/tunnel-proxy: nwp-public
