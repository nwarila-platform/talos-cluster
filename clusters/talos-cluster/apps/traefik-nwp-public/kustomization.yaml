apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  # Namespaced so overlays accumulated under one parent index keep distinct
  # ids; the local-config annotation still prunes it from the render.
  - name: tunnel-contract
    namespace: traefik-nwp-public
    literals:
      - tunnel=nwp-public
      - tenantNamespace=nwp-1306985678
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    config.kubernetes.io/local-config: "true"
components:
  - ../_components/tunnel-proxy
