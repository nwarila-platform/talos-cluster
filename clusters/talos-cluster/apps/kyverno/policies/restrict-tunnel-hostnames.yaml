apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-tunnel-hostnames
  annotations:
    policies.kyverno.io/title: Restrict Tunnel Hostnames
    policies.kyverno.io/category: Multi-Tenancy
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Ingress
    policies.kyverno.io/description: >-
      Constrains each tunnel ingress class to the DNS zone its connector
      serves and enforces the TCP 8080 Service-backend contract used by the
      opt-in network policies. Two classes may share one zone when their
      tiers are separated by the tunnel-name pod label and per-hostname edge
      registration; a nested protected zone, if one is ever declared, is
      barred from its unprotected outer class here.
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  evaluation:
    background:
      enabled: false
  webhookConfiguration:
    timeoutSeconds: 5
  matchConstraints:
    matchPolicy: Equivalent
    namespaceSelector:
      matchLabels:
        nwarila.io/tenant: "true"
    resourceRules:
      - apiGroups: [networking.k8s.io]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [ingresses]
  variables:
    - name: org
      expression: >-
        namespaceObject != null && has(namespaceObject.metadata.labels) &&
        'nwarila.io/org' in namespaceObject.metadata.labels
          ? namespaceObject.metadata.labels['nwarila.io/org']
          : ''
    - name: class
      expression: >-
        has(object.spec.ingressClassName) ? object.spec.ingressClassName : ''
    # Admission webhooks have no ordering guarantee. Apply these checks only
    # after cft2's org, legacy-annotation, and class preconditions all pass.
    - name: applies
      expression: >-
        (!has(object.metadata.annotations) ||
        !('kubernetes.io/ingress.class' in object.metadata.annotations)) &&
        ((variables.org == 'the-hero-wars-guys' &&
          variables.class == 'cf-tunnel-hwg') ||
         (variables.org == 'nwarila-platform' &&
          (variables.class == 'cf-tunnel-nwp-public' ||
           variables.class == 'cf-tunnel-nwp-mtls')))
    # The zone each connector actually serves, mirroring its ConfigMap
    # ingress rules. A hostname outside it would resolve to no origin.
    - name: zone
      expression: >-
        variables.class == 'cf-tunnel-hwg' ? 'theherowarsguys.com' :
        variables.class == 'cf-tunnel-nwp-public' ? 'nickwarila.com' :
        variables.class == 'cf-tunnel-nwp-mtls' ? 'nickwarila.com' : ''
    # Non-empty only for a class whose connector is unauthenticated while a
    # protected sibling zone nests inside its own zone. Both nwp classes share
    # nickwarila.com outright, so nothing nests and this stays empty.
    - name: protectedZone
      expression: >-
        ''
    - name: canaryHost
      expression: >-
        variables.class == 'cf-tunnel-hwg' ? 'canary-hwg.theherowarsguys.com' :
        variables.class == 'cf-tunnel-nwp-public' ? 'canary-nwp-public.nickwarila.com' :
        variables.class == 'cf-tunnel-nwp-mtls' ? 'canary-nwp-mtls.nickwarila.com' : ''
  validations:
    - expression: >-
        !variables.applies ||
        (has(object.spec.rules) && size(object.spec.rules) > 0)
      message: tunnel Ingress must declare at least one rule
    - expression: >-
        !variables.applies || !has(object.spec.defaultBackend)
      message: tunnel Ingress must not declare spec.defaultBackend
    - expression: >-
        !variables.applies || !has(object.spec.rules) ||
        object.spec.rules.all(rule, has(rule.host) && rule.host != '')
      message: every tunnel Ingress rule must declare a host
    - expression: >-
        !variables.applies || !has(object.spec.rules) ||
        object.spec.rules.all(rule,
          !has(rule.host) || rule.host == variables.zone ||
          (rule.host.endsWith('.' + variables.zone) &&
          size(rule.host) > size('.' + variables.zone)))
      message: tunnel Ingress hosts must be inside the zone its class serves
      messageExpression: >-
        'tunnel Ingress hosts must be inside ' + variables.zone
    - expression: >-
        !variables.applies || !has(object.spec.rules) ||
        object.spec.rules.all(rule,
          !has(rule.host) || rule.host != variables.zone)
      message: the bare zone apex is reserved
      messageExpression: >-
        'the bare ' + variables.zone + ' apex is reserved'
    # An unprotected class must not reach into the protected zone. Without
    # this, a tenant could publish the same origin on a second hostname that
    # bypasses the edge client-certificate requirement entirely.
    - expression: >-
        !variables.applies || variables.protectedZone == '' ||
        !has(object.spec.rules) ||
        object.spec.rules.all(rule,
          !has(rule.host) ||
          (rule.host != variables.protectedZone &&
          !rule.host.endsWith('.' + variables.protectedZone)))
      message: unprotected tunnel Ingress hosts must not enter the protected zone
      messageExpression: >-
        'unprotected tunnel Ingress hosts must not be inside ' +
        variables.protectedZone
    - expression: >-
        !variables.applies || !has(object.spec.rules) ||
        object.spec.rules.all(rule,
          !has(rule.host) || !rule.host.contains('*'))
      message: wildcard tunnel Ingress hosts are not permitted
    - expression: >-
        !variables.applies || !has(object.spec.rules) ||
        object.spec.rules.all(rule,
          !has(rule.host) || rule.host != variables.canaryHost)
      message: the class canary hostname is reserved
      messageExpression: >-
        variables.canaryHost + ' is reserved'
    - expression: >-
        !variables.applies || !has(object.spec.tls)
      message: tunnel Ingress must not declare spec.tls
    - expression: >-
        !variables.applies || !has(object.metadata.annotations) ||
        object.metadata.annotations.all(key,
          !key.startsWith('traefik.ingress.kubernetes.io/') &&
          !key.startsWith('traefik.io/'))
      message: Traefik provider annotations are not permitted
    - expression: >-
        !variables.applies || !has(object.spec.rules) ||
        object.spec.rules.all(rule,
          has(rule.http) && has(rule.http.paths) && size(rule.http.paths) > 0)
      message: every tunnel Ingress rule must declare at least one HTTP path
    - expression: >-
        !variables.applies || !has(object.spec.rules) ||
        object.spec.rules.all(rule,
          !has(rule.http) || !has(rule.http.paths) ||
          rule.http.paths.all(path,
            has(path.backend.service) &&
            has(path.backend.service.port.number) &&
            path.backend.service.port.number == 8080))
      message: every tunnel Ingress backend must be a Service on numeric port 8080
