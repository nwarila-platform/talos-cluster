apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: talos-drift-etcd-snapshot-read
  namespace: dr-etcd-backup
  labels:
    app.kubernetes.io/name: etcd-backup
    app.kubernetes.io/component: monitoring
rules:
  - apiGroups:
      - batch
    resources:
      - cronjobs
    resourceNames:
      - etcd-snapshot
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: talos-drift-etcd-snapshot-read
  namespace: dr-etcd-backup
  labels:
    app.kubernetes.io/name: etcd-backup
    app.kubernetes.io/component: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: talos-drift-etcd-snapshot-read
subjects:
  - kind: ServiceAccount
    name: talos-drift
    namespace: talos-drift
