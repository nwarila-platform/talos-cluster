apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: traefik-tunnelplaceholder-network
  namespace: traefik-tunnelplaceholder
spec:
  endpointSelector:
    matchLabels:
      nwarila.io/tunnel-proxy: tunnelplaceholder
  ingress:
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": cloudflared-tunnelplaceholder
            "k8s:app.kubernetes.io/name": cloudflared
            "k8s:app.kubernetes.io/instance": tunnelplaceholder
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
  egress:
    # kubernetes.default.svc:443 is translated to the API server's 6443
    # endpoint before Cilium enforces L4 policy.
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    # The tunnel-exposed label carries the TUNNEL NAME, not a boolean. That is
    # what keeps a workload published on this tunnel from being reachable by
    # the sibling tunnel's proxy in the same tenant namespace.
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": tenantnsplaceholder
            "k8s:nwarila.io/tunnel-exposed": "tunnelplaceholder"
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
