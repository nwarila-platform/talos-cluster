apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik-tunnelplaceholder
  namespace: traefik-tunnelplaceholder
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: traefik-tunnelplaceholder
rules:
  - apiGroups: [networking.k8s.io]
    resources: [ingressclasses]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: traefik-tunnelplaceholder
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: traefik-tunnelplaceholder
subjects:
  - kind: ServiceAccount
    name: traefik-tunnelplaceholder
    namespace: traefik-tunnelplaceholder
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: traefik-tunnelplaceholder
  namespace: tenantnsplaceholder
rules:
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  # Accepted risk: stock Traefik waits for this informer cache. This exposes
  # the rotatable tenant Secrets documented in the rotation runbook.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: traefik-tunnelplaceholder
  namespace: tenantnsplaceholder
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: traefik-tunnelplaceholder
subjects:
  - kind: ServiceAccount
    name: traefik-tunnelplaceholder
    namespace: traefik-tunnelplaceholder
