apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: cloudflared-nwp-public
data:
  config.yaml: |
    tunnel: 1f59f78a-16f8-4e3c-8567-de0235e39871
    credentials-file: /etc/cloudflared/creds/credentials.json
    metrics: 0.0.0.0:2000
    no-autoupdate: true
    # This connector is configured to receive the *.nickwarila.com wildcard
    # after that owner-gated DNS route is provisioned. It will then be the
    # default landing for hostnames nobody has registered explicitly. That is
    # safe: a workload published on the mTLS tier carries the
    # nwp-mtls label value, which this connector's proxy cannot select, so an
    # unregistered protected hostname 404s here instead of leaking.
    ingress:
      - hostname: canary-nwp-public.nickwarila.com
        service: http_status:418
      - hostname: '*.nickwarila.com'
        service: http://traefik-nwp-public.traefik-nwp-public.svc:80
      - service: http_status:404
