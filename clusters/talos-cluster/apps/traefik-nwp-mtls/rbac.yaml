apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik-nwp-mtls
  namespace: traefik-nwp-mtls
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: traefik-nwp-mtls
rules:
  - apiGroups: [networking.k8s.io]
    resources: [ingressclasses]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: traefik-nwp-mtls
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: traefik-nwp-mtls
subjects:
  - kind: ServiceAccount
    name: traefik-nwp-mtls
    namespace: traefik-nwp-mtls
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: traefik-nwp-mtls
  namespace: nwp-1306985678
rules:
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  # Accepted risk: stock Traefik waits for this informer cache. This exposes
  # the rotatable tenant Secrets documented in the rotation runbook.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: traefik-nwp-mtls
  namespace: nwp-1306985678
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: traefik-nwp-mtls
subjects:
  - kind: ServiceAccount
    name: traefik-nwp-mtls
    namespace: traefik-nwp-mtls
