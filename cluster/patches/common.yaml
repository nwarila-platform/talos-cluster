machine:
  features:
    rbac: true
    apidCheckExtKeyUsage: true
    diskQuotaSupport: true
    kubePrism:
      enabled: true
      port: 7445
  install:
    wipe: true
  kubelet:
    # Matches platform/longhorn/values.yaml defaultDataPath and the longhorn UserVolumeConfig.
    extraMounts:
      - destination: /var/mnt/longhorn
        type: bind
        source: /var/mnt/longhorn
        options:
          - bind
          - rshared
          - rw
    nodeIP:
      validSubnets:
        - 10.69.112.0/24
  network:
    nameservers:
      - 10.69.112.1
  time:
    servers:
      - 10.69.112.1
cluster:
  network:
    cni:
      name: none
    podSubnets:
      - 10.244.0.0/16
    serviceSubnets:
      - 10.96.0.0/12
  proxy:
    disabled: false
  discovery:
    registries:
      kubernetes:
        disabled: false
      service:
        disabled: false
