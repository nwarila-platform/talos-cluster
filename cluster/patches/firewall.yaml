---
apiVersion: v1alpha1
kind: NetworkDefaultActionConfig
ingress: block
---
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: ingress-talos-api
portSelector:
  ports: [50000, 50001]
  protocol: tcp
ingress:
  - subnet: 10.69.12.0/24
  - subnet: 10.69.112.0/24
---
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: ingress-kubernetes-api
portSelector:
  ports: [6443]
  protocol: tcp
ingress:
  - subnet: 10.69.12.0/24
  - subnet: 10.69.112.0/24
  - subnet: 10.244.0.0/16
---
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: ingress-kubelet
portSelector:
  ports: [10250]
  protocol: tcp
ingress:
  - subnet: 10.69.112.0/24
  - subnet: 10.244.0.0/16
---
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: ingress-etcd
portSelector:
  ports: [2379, 2380]
  protocol: tcp
ingress:
  - subnet: 10.69.112.0/24
---
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: ingress-calico-vxlan
portSelector:
  ports: [4789]
  protocol: udp
ingress:
  - subnet: 10.69.112.0/24
---
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: ingress-calico-typha
portSelector:
  ports: [5473]
  protocol: tcp
ingress:
  - subnet: 10.69.112.0/24
---
# The runner reaches Vault through this node-local entry point. Vault's ACL
# and GitLab JWT role remain the authorization boundary.
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: ingress-vault
portSelector:
  ports: [30200]
  protocol: tcp
ingress:
  - subnet: 10.69.12.0/24
  - subnet: 10.69.112.0/24
