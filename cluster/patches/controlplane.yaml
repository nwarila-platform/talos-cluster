machine:
  nodeLabels:
    nwarila.io/pool: management
  nodeTaints:
    nwarila.io/management: NoSchedule
cluster:
  # Replace Talos' default control-plane taint with the explicit management
  # taint above. Only platform services (Calico, Longhorn, Argo CD, Vault) and
  # Talos' kube-proxy DaemonSet (which tolerates every NoSchedule taint) tolerate it.
  allowSchedulingOnControlPlanes: true
  apiServer:
    admissionControl:
      - name: PodSecurity
        configuration:
          apiVersion: pod-security.admission.config.k8s.io/v1alpha1
          kind: PodSecurityConfiguration
          defaults:
            enforce: baseline
            enforce-version: latest
            audit: restricted
            audit-version: latest
            warn: restricted
            warn-version: latest
          exemptions:
            # Talos supplies kube-system, and strategic merge appends this list.
            namespaces:
              - tigera-operator
              - calico-system
            runtimeClasses: []
            usernames: []
